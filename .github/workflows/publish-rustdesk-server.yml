# Publish patched hbbs/hbbr image (HTTP API proxy for rustdesk-api-srv)
#
# Builds from this repository's source (patch already applied) and publishes:
#   - ghcr.io/<owner>/rustdesk-server:<tag>
#   - <owner>/rustdesk-server:<tag> on Docker Hub when DOCKERHUB_* secrets exist

name: publish-rustdesk-server

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/publish-rustdesk-server.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/publish-rustdesk-server.yml'

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/rustdesk-server
  DOCKERHUB_IMAGE: ${{ github.repository_owner }}/rustdesk-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: API proxy unit tests
        run: cargo test --locked --lib api_proxy::tests

      - name: Release build smoke
        run: |
          cargo build --locked --release --bin hbbs --bin hbbr
          ./target/release/hbbs --help | grep -F -- '--api-server'
          ./target/release/hbbr --help >/dev/null

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decide registries
        id: reg
        shell: bash
        run: |
          images="${GHCR_IMAGE}"
          push_hub=false
          if [[ "${{ github.event_name }}" != "pull_request" \
             && -n "${{ secrets.DOCKERHUB_USERNAME }}" \
             && -n "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            images+=$'\n'"${DOCKERHUB_IMAGE}"
            push_hub=true
          fi
          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
            echo "push_hub=${push_hub}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.reg.outputs.push_hub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.reg.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=tag

      - name: Build (and push on non-PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # amd64 first; arm64 via QEMU takes 45m+ on GHA — add back when needed
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
